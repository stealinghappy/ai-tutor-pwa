<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>家長介面 - AI 家教遊戲系統</title>
<style>
  body { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; background: #f4f2f7; color: #2a2536; margin: 0; padding: 24px; }
  h1 { font-size: 22px; }
  h2 { font-size: 18px; margin-top: 32px; }
  .player-card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .player-card h3 { margin-top: 0; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #eee; font-size: 14px; }
  .eval-box { background: #fbf7ee; border-left: 4px solid #b23a48; padding: 12px 16px; margin-top: 12px; font-size: 14px; white-space: pre-wrap; border-radius: 0 8px 8px 0; }
  .voucher-list { font-size: 13px; color: #555; }
  .voucher-item { background: #fff; padding: 8px 12px; border-radius: 8px; margin-bottom: 6px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .empty { color: #999; font-size: 13px; }
</style>
</head>
<body>
  <h1>👨‍👩‍👧 家長介面</h1>
  <div id="players"></div>

  <h2>🎫 兌換憑證</h2>
  <div id="vouchers" class="voucher-list"></div>

  <script src="dashboard.js"></script>
</body>
</html>
