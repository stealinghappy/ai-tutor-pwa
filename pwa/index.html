<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1024, initial-scale=1.0, user-scalable=no" />
<title>AI 家教遊戲系統（遠端版）</title>
<style>
  :root {
    --bg: #14121a;
    --panel: #201c29;
    --accent: #b23a48;
    --accent2: #4a7c59;
    --text: #eee6e6;
    --muted: #9a8fae;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    overflow: hidden;
  }
  #app { width: 100%; height: 100%; display: flex; flex-direction: column; }

  #select-screen {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px;
  }
  #select-screen h1 { font-size: 28px; letter-spacing: 2px; }
  .select-group { display: flex; gap: 16px; }
  .select-btn {
    padding: 14px 28px; font-size: 18px; border-radius: 10px; border: 2px solid var(--accent);
    background: var(--panel); color: var(--text); cursor: pointer;
  }
  .select-btn.active, .select-btn:hover { background: var(--accent); }
  #start-btn {
    margin-top: 12px; padding: 16px 48px; font-size: 20px; border-radius: 12px; border: none;
    background: var(--accent2); color: #fff; cursor: pointer;
  }
  #start-btn:disabled { opacity: .4; cursor: not-allowed; }

  #battle-screen { flex: 1; display: none; }
  #battle-screen.active { display: flex; }
  #top-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid #3a3446;
  }
  #battle-body { flex: 1; display: flex; }
  #battlefield {
    flex: 1.1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, #2a2333 0%, #14121a 80%);
    position: relative;
  }
  #monster-name { font-size: 20px; margin-bottom: 8px; color: var(--muted); }
  .sprite-player { width: 320px; height: 320px; display: flex; align-items: center; justify-content: center; position: relative; }
  .sprite-frame-img { max-width: 100%; max-height: 100%; image-rendering: pixelated; }
  .sprite-placeholder-label {
    display: none; align-items: center; justify-content: center;
    width: 220px; height: 220px; border-radius: 16px; border: 3px dashed var(--accent);
    color: var(--accent); font-size: 22px; letter-spacing: 4px; text-align: center;
  }
  #monster-hp { width: 260px; margin-top: 12px; }
  .hp-bar-outer { width: 100%; height: 14px; background: #3a3446; border-radius: 7px; overflow: hidden; }
  .hp-bar-inner { height: 100%; background: var(--accent); transition: width .3s; }
  .hp-bar-text { text-align: center; font-size: 12px; color: var(--muted); margin-top: 2px; }

  #question-panel {
    flex: 1; padding: 24px; display: flex; flex-direction: column; gap: 16px;
    background: var(--panel); border-left: 1px solid #3a3446; position: relative;
  }
  .question-text { font-size: 20px; line-height: 1.6; min-height: 3em; }
  .choices { display: flex; flex-direction: column; gap: 10px; }
  .choice-btn {
    text-align: left; padding: 12px 16px; border-radius: 8px; border: 1px solid #4a4358;
    background: #2a2536; color: var(--text); font-size: 16px; cursor: pointer;
  }
  .choice-btn:hover { border-color: var(--accent); background: #352830; }
  .hint-btn { align-self: flex-start; background: none; border: none; color: var(--muted); cursor: pointer; margin-right: 8px; }
  .diagram-note { font-size: 13px; color: var(--muted); }

  #player-hp .hp-heart { font-size: 18px; margin-right: 2px; }
  #coins, #heal-items { font-size: 16px; }
  .heal-use-btn { margin-left: 8px; padding: 4px 10px; border-radius: 6px; border: none; background: var(--accent2); color: #fff; cursor: pointer; }
  .heal-use-btn:disabled { opacity: .3; cursor: not-allowed; }

  .feedback {
    position: absolute; top: 12px; right: 24px; font-size: 18px; font-weight: bold;
    opacity: 0; transition: opacity .3s;
  }
  .feedback.correct { color: #6fd08c; }
  .feedback.wrong { color: #e08585; }

  .empty-state { color: var(--muted); text-align: center; padding: 40px; }

  /* 遠端版專用：連線中遮罩 */
  #conn-overlay {
    position: fixed; inset: 0; background: rgba(10, 8, 14, .96);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; z-index: 999; text-align: center; padding: 24px;
  }
  #conn-overlay.hidden { display: none; }
  #conn-title { font-size: 20px; color: #c9a6ff; }
  #conn-status { font-size: 14px; color: var(--muted); max-width: 480px; }
  #conn-retry {
    margin-top: 8px; padding: 10px 24px; border-radius: 8px; border: none;
    background: var(--accent); color: #fff; cursor: pointer; display: none;
  }
  .conn-spinner {
    width: 36px; height: 36px; border-radius: 50%;
    border: 4px solid #3a3446; border-top-color: var(--accent);
    animation: conn-spin 0.9s linear infinite;
  }
  @keyframes conn-spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="conn-overlay">
  <div class="conn-spinner"></div>
  <div id="conn-title">正在連線家裡的主機…</div>
  <div id="conn-status">準備中…</div>
  <button id="conn-retry">重新連線</button>
</div>

<div id="app">

  <div id="select-screen">
    <h1>🎮 AI 家教遊戲系統（遠端版）</h1>
    <div>
      <div style="margin-bottom:6px; color: var(--muted);">選擇玩家</div>
      <div class="select-group" id="player-select">
        <button class="select-btn" data-player="junior" data-grade="junior">國一</button>
        <button class="select-btn" data-player="senior" data-grade="senior">高三</button>
      </div>
    </div>
    <div>
      <div style="margin-bottom:6px; color: var(--muted);">選擇科目</div>
      <div class="select-group" id="subject-select">
        <button class="select-btn" data-subject="english">英文</button>
        <button class="select-btn" data-subject="math">數學</button>
        <button class="select-btn" data-subject="chinese">國文</button>
      </div>
    </div>
    <button id="start-btn" disabled>開始打怪</button>
  </div>

  <div id="battle-screen">
    <div style="width:100%; display:flex; flex-direction:column;">
      <div id="top-bar">
        <div id="player-hp"></div>
        <div style="display:flex; gap:16px; align-items:center;">
          <div id="coins"></div>
          <div id="heal-items"></div>
        </div>
        <button id="back-btn" class="select-btn" style="padding:6px 14px; font-size:14px;">返回選單</button>
      </div>
      <div id="battle-body">
        <div id="battlefield">
          <div id="monster-name"></div>
          <div id="monster-stage" class="sprite-player"></div>
          <div id="monster-hp"></div>
        </div>
        <div id="question-panel">
          <div class="feedback" id="feedback"></div>
          <div id="question-area"></div>
        </div>
      </div>
    </div>
  </div>

</div>

<!-- 遠端版專屬：資源路徑改用相對路徑前綴（這頁比本機版多隔一層 pwa/
     目錄，root-relative 的 /assets/... 在 repo 沒部署在網域根目錄時會抓不到檔案），
     並先接好 WebRTC 傳輸層，把 fetch('/api/...') 攔截改走 WebRTC DataChannel，
     下面的遊戲邏輯 script 完全不用改 -->
<script>window.AITUTOR_ASSET_BASE = "../";</script>
<script src="../shared/webrtc_transport.js"></script>
<script src="../shared/fetch_shim.js"></script>

<script src="../shared/wallet.js"></script>
<script src="../shared/audio.js"></script>
<script src="../shared/achievement.js"></script>
<script src="../rpg/animation.js"></script>
<script src="../rpg/ui.js"></script>
<script src="../rpg/battle.js"></script>
<script>
(function () {
  // ── 連線中遮罩：等 WebRTC 打通才讓玩家開始玩 ─────────────────────
  const overlay = document.getElementById("conn-overlay");
  const statusEl = document.getElementById("conn-status");
  const retryBtn = document.getElementById("conn-retry");

  AITutorTransport.on("status", (msg) => {
    statusEl.textContent = msg;
  });
  AITutorTransport.on("connected", () => {
    overlay.classList.add("hidden");
  });
  AITutorTransport.on("failed", (err) => {
    statusEl.textContent = "連線失敗：" + err.message + "（請確認家裡主機端的 telethon_listener.py 有在執行）";
    retryBtn.style.display = "inline-block";
  });
  retryBtn.addEventListener("click", () => location.reload());

  // ── 以下跟本機版 index.html 完全相同 ────────────────────────────
  let selectedPlayer = null;
  let selectedGrade = null;
  let selectedSubject = null;

  const playerBtns = document.querySelectorAll("#player-select .select-btn");
  const subjectBtns = document.querySelectorAll("#subject-select .select-btn");
  const startBtn = document.getElementById("start-btn");

  playerBtns.forEach((btn) => {
    btn.addEventListener("click", () => {
      playerBtns.forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      selectedPlayer = btn.dataset.player;
      selectedGrade = btn.dataset.grade;
      updateStartBtn();
    });
  });

  subjectBtns.forEach((btn) => {
    btn.addEventListener("click", () => {
      subjectBtns.forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      selectedSubject = btn.dataset.subject;
      updateStartBtn();
    });
  });

  function updateStartBtn() {
    startBtn.disabled = !(selectedPlayer && selectedSubject);
  }

  startBtn.addEventListener("click", () => {
    document.getElementById("select-screen").style.display = "none";
    const battleScreen = document.getElementById("battle-screen");
    battleScreen.classList.add("active");

    const els = {
      playerHpEl: document.getElementById("player-hp"),
      monsterHpEl: document.getElementById("monster-hp"),
      coinsEl: document.getElementById("coins"),
      healEl: document.getElementById("heal-items"),
      monsterNameEl: document.getElementById("monster-name"),
      monsterStage: document.getElementById("monster-stage"),
      questionArea: document.getElementById("question-area"),
      feedbackEl: document.getElementById("feedback"),
    };

    const session = new AITutor.Battle.BattleSession({
      playerId: selectedPlayer,
      grade: selectedGrade,
      subject: selectedSubject,
      els,
    });
    session.start();
  });

  document.getElementById("back-btn").addEventListener("click", () => {
    location.reload();
  });
})();
</script>
</body>
</html>
